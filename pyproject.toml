[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "LitSift"
version = "0.1.0"
description = "Simple UI to find relevant papers"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Oliver Leicht", email = "oliverleicht@gmx.de" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "openreview-py",
    "tqdm",
    "voyageai",
    "PySide6",
    "jupyter>=1.1.1",
    "jupyterlab>=4.5.5",
    "polars>=1.36.1",
]

[project.urls]
Repository = "https://github.com/oleicht/LitSift"

[project.scripts]
lit-sift = "app.main:main"

[tool.setuptools.packages.find]
where = ["."]
